name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: go vet ./... && go test -race -p 2 ./...
      - name: fmt-check
        run: make fmt-check
      - name: shellcheck install.sh
        run: shellcheck install.sh
