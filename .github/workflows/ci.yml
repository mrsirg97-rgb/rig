name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # the worker jail's e2e must not skip: bubblewrap installed, and the
      # userns AppArmor restriction off so bwrap can run unprivileged
      # (sandbox_e2e_test skips naming both when they are missing)
      - name: the worker jail can run unprivileged
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get -y install bubblewrap >/dev/null
      # the python door's e2e must not install from PyPI: the venv is a
      # fixture here, and testenv links it into every throwaway home (the
      # kernel tests otherwise bootstrap one per package run)
      - name: the python kernel's venv
        run: |
          python3 -m venv "$HOME/.pi/agent/kernel-venv"
          "$HOME/.pi/agent/kernel-venv/bin/pip" install --quiet ipython numpy pandas
      # view's video cases skip by name without ffmpeg; it is a fixture here.
      - name: the video fixture
        run: sudo apt-get -y install ffmpeg >/dev/null
      - name: test
        run: go vet ./... && go test -race -p 2 ./...
      - name: fmt-check
        run: make fmt-check
      # the README's measured block is computed, never typed: the tree
      # numbers are re-read live and the store numbers come from the
      # committed aggregates in docs/measured.json
      - name: measured-check
        run: python3 scripts/readme-measured check
      # the site is assembled and checked on every PR too: a dead relative
      # link or an unrendered placeholder fails here, not on main after deploy
      - name: site
        run: python3 scripts/site-build --out "$RUNNER_TEMP/site"
      - name: shellcheck install.sh and scripts/wire-check
        run: shellcheck install.sh scripts/wire-check

  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: freeze
        run: go run ./cmd/freeze -branch "${GITHUB_HEAD_REF:-}"

  wire:
    runs-on: ubuntu-latest
    env:
      MENU_AIM: '15000'
      MENU_WALL: '16500'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: wire
        run: scripts/wire-check
