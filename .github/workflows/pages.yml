name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit count needs the whole history
      # One script assembles the artifact: it copies site/ and install.sh,
      # renders every page's numbers from main.go, the log and the stores'
      # aggregates, and refuses an unrendered placeholder or a dead link.
      - name: assemble the site artifact
        run: python3 scripts/site-build --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
