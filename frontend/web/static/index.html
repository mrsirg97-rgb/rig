<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rig serve</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <button id="nav-toggle" aria-label="toggle the navigation" aria-expanded="false">≡</button>
    <h1>rig<span class="sub"> serve</span></h1>
  </div>
  <form id="cwd-form" class="cwdpick">
    <label for="cwd">cwd</label>
    <select id="cwd" aria-label="workspace"></select>
    <input id="cwd-add" type="text" placeholder="add a workspace path…" spellcheck="false" autocomplete="off">
    <button id="cwd-add-btn" type="submit">add</button>
  </form>
</header>
<div class="layout">
  <nav id="nav" aria-label="views">
    <button data-view="sessions" class="active">Sessions</button>
    <button data-view="todos">Todos</button>
    <button data-view="scheduler">Scheduler</button>
    <button data-view="memory">Memory</button>
    <button data-view="models">Models</button>
    <button data-view="plugins">Plugins</button>
  </nav>
  <div id="backdrop" hidden></div>
  <main id="main" aria-live="polite"></main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
