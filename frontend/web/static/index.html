<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rig serve</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <button id="nav-toggle" class="nav-toggle" aria-label="toggle the navigation" aria-expanded="false">≡</button>
    <h1><span class="ember">rig</span><span class="sub"> serve</span></h1>
  </div>
  <form id="cwd-form" class="cwdpick">
    <span class="dim">cwd</span>
    <select id="cwd" aria-label="workspace"></select>
    <input id="cwd-add" type="text" placeholder="add a workspace path…" spellcheck="false" autocomplete="off">
    <button id="cwd-add-btn" type="submit">add</button>
    <button id="browse-btn" type="button" aria-expanded="false">browse</button>
  </form>
</header>
<div id="browser" hidden></div>
<div class="layout">
  <nav id="nav" aria-label="views">
    <button data-view="sessions" class="active">sessions</button>
    <button data-view="todos">todo</button>
    <button data-view="scheduler">scheduler</button>
    <button data-view="models">models</button>
    <button data-view="plugins">plugins</button>
  </nav>
  <div id="backdrop" hidden></div>
  <main id="main" aria-live="polite"></main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
