# The rig web-tools bundle, generated by `rig webtools setup` (rig {{VERSION}}).
# The proxy config is baked into its image: after editing a file, apply it with
# `docker compose up -d --build` in this directory, or `rig webtools start`.
services:
  searxng:
    image: searxng/searxng:2026.10.25-54ca1d9cf
    container_name: rig-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:{{SEARX_PORT}}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - rig-searxng-cache:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:{{SEARX_PORT}}/
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=4
    mem_limit: 1g
    memswap_limit: 1g
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    user: "977:977"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=4m,mode=1777
    networks:
      - rig-external
    depends_on:
      valkey:
        condition: service_healthy

  tinyproxy:
    build: ./tinyproxy
    container_name: rig-tinyproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:{{PROXY_PORT}}:8888"
    networks:
      - rig-external
    mem_limit: 64m
    memswap_limit: 64m
    cpus: '0.5'
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777

  valkey:
    image: valkey/valkey:9-alpine
    container_name: rig-searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning --maxmemory 64mb --maxmemory-policy volatile-lru
    restart: unless-stopped
    volumes:
      - rig-valkey-data:/data/
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    memswap_limit: 128m
    cpus: '0.5'
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    user: "999:1000"
    networks:
      - rig-external

volumes:
  rig-searxng-cache:
    name: rig-searxng-cache
  rig-valkey-data:
    name: rig-valkey-data

networks:
  rig-external:
    name: rig-external
    driver: bridge
    ipam:
      config:
        - subnet: {{SUBNET}}
