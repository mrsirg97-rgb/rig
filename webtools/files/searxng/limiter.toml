# SearXNG bot-detection passlist, generated by `rig webtools setup`.
# Measured 2026-10-26 on this subnet: host-originated traffic (rig's own search,
# curl from the host) arrives at the container as the bridge gateway, {{GATEWAY}},
# because the published port path hides the source. Traffic relayed through the
# egress proxy arrives as the proxy's own address inside the same /24 and is
# deliberately NOT passlisted, so a foreign container relaying through the egress
# proxy is subject to the limiter. pass_ip must stay the gateway of {{SUBNET}}:
# passlisting the whole /24 hands the limiter to every local container.
[botdetection.ip_lists]
pass_ip = [
  '{{GATEWAY}}/32',
]
