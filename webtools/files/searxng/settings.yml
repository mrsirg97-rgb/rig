# SearXNG settings, generated by `rig webtools setup` (rig {{VERSION}}).
# secret_key is generated per machine and reused by every later setup, so a
# re-run does not invalidate the limiter rows or the static-file hashes.
# The bind-mount means an edit lands on a plain restart (unlike the proxy, whose
# config is baked into its image): docker compose restart searxng is enough here.
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

server:
  secret_key: "{{SECRET}}"
  limiter: true
  public_instance: false
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

search:
  safe_search: 0
  autocomplete: ""
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineCaptcha: 86400
    SearxEngineAccessDenied: 86400
    SearxEngineTooManyRequests: 3600
  formats:
    - html
    - json

ui:
  static_use_hash: true

valkey:
  url: valkey://valkey:6379/0
