# rig egress proxy config, generated by `rig webtools setup` (rig {{VERSION}}).
# Baked into the image by the Dockerfile next to this file, so an edit lands only
# after `docker compose up -d --build` (a restart keeps the copy in the image).
# IP and destination policy live here and in ./filter; nothing depends on
# DOCKER-USER rules, which Docker Desktop wipes on a VM restart.

Port 8888
Timeout 60
MaxClients 32
LogLevel Warning
Allow {{SUBNET}}
ConnectPort 443
DisableViaHeader Yes

# Destination deny-list. See ./filter for the engine and its measured limits:
# string-level matching, so DNS rebinding slips, and CONNECT tunnels can never
# match a "://" rule (ConnectPort 443 confines CONNECT to the port only).
# Parser quirks measured on this build (1.11.3-r0):
#   - the filter PATH must be QUOTED (unquoted => "Syntax error"); the man page's
#     unquoted examples are roff formatting and mislead
#   - FilterType "quoted" fails to parse; `FilterType fnmatch` unquoted parses but
#     silently DISABLES all filtering (every request answers 200); `FilterType bre`
#     parses and still matches as globs. No FilterType line keeps the default
#     engine, fnmatch globs, which ./filter is written for.
#   - boolean values parse unquoted.
Filter "/etc/tinyproxy/filter"
FilterURLs On
FilterCaseSensitive Yes
FilterDefaultDeny No

# The credential gate (measured 2026-10-26: unauth 407, correct creds 200, wrong
# password 407, foreign-subnet unauth 407). Before this, any container on the
# machine could relay through the proxy: Allow cannot bind it, because cross-subnet
# clients arrive as the bridge gateway ({{GATEWAY}}), which is inside its own /24.
# The password is UNQUOTED: the quoted form parses the quotes into the password and
# every request gets 401. The realm is QUOTED: unquoted is "Syntax error" and
# tinyproxy refuses to start. A realm of "proxy" keeps the stock realm "Tinyproxy"
# out of the 407 challenge, so the reply does not advertise the software.
BasicAuth rig {{PW}}
BasicAuthRealm "proxy"
