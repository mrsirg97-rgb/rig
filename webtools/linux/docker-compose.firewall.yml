# The egress firewall, generated by `rig webtools setup` on Linux (rig {{VERSION}}).
# rig runs compose with this file after docker-compose.yml: by hand,
#   docker compose -f docker-compose.yml -f docker-compose.firewall.yml up -d --build
# The firewall writes its rules into the host's DOCKER-USER chain (host network,
# NET_ADMIN), and tinyproxy and searxng start only once its healthcheck finds every
# rule there. restart: unless-stopped brings it back with the daemon, so the rules
# come back after a reboot with no systemd unit. Setup writes this file on Linux
# only: Docker Desktop's daemon lives in a VM whose firewall this is not measured
# against. A daemon with no DOCKER-USER chain (Docker Desktop on Linux, the
# nftables backend) leaves the firewall unhealthy, so the proxy does not start:
# closed, not open.
services:
  firewall:
    build: ./firewall
    container_name: rig-webtools-firewall
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=1m
    mem_limit: 32m
    memswap_limit: 32m
    cpus: '0.1'
    healthcheck:
      test: ["CMD", "/usr/local/bin/egress.sh", "check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"

  tinyproxy:
    depends_on:
      firewall:
        condition: service_healthy

  searxng:
    depends_on:
      firewall:
        condition: service_healthy
